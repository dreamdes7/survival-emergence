# ── Master config — the knobs you control ────────────────────────────────────
# Loads scenarios/<scenario>.yaml for the survival layer (terrain, resources,
# physiology, escape condition).

scenario: island          # mars | island
seed: 42

# ── Palimpsest — cross-run island memory (off by default) ─────────────────────
# The island remembers past runs on the SAME seed: graves, ruins, inherited
# place-names and found diaries surface in the next run as weathered artifacts —
# history nobody alive wrote, misread into myth. Keyed by (scenario, seed).
#   off       — normal run: no reading, no trace left (default)
#   on        — dig up past layers AND leave a new one (IF this run earns it)
#   read_only — dig up the past, but leave no trace (experiments/demos)
# A quality floor keeps junk out: a run that built/buried/named too little leaves
# no layer. Raise/lower it with palimpsest_floor (default 5.0).
palimpsest: off

sim:
  max_days: 4
  day_length_ticks: 12    # ticks per sim-day
  reflect_every: 6        # run agent reflection every N ticks
  tick_seconds: 0         # 0 = run as fast as possible (headless)
  api_tick_seconds: 1     # observer API cadence
  move_speed: 3           # tiles an agent crosses per go_to (faster traversal)
  # Emergency gate = a THIN DEATHBED BACKSTOP, not a co-pilot. The survival math
  # ("water lasts 4 turns, spring is 5 away, go now") now lives in the PROMPT
  # (_survival_foresight), so the MODEL self-preserves; the gate only catches a
  # brain that ignored ❗/💀 and is dying anyway. Fires below critical×this.
  #   1.0 = deathbed only (default) — heuristic-authored share should trend to ~0
  #   0   = PURE run: no backstop, agents live or die by their own choices
  #  >1.5 = paternalistic (the old contamination problem — avoid)
  emergency_multiplier: 1.0
  # Conversation scenes: a say_to that lands on an adjacent agent plays out up to
  # N extra replies in the same tick (real dialogue instead of one line per tick).
  # 0 = off. Real-LLM replies use a compact cheap prompt, stubs use a phrase pool.
  # Lowered 4->2: at 4 a single "давай построим" spawned a whole agree-to-build
  # scene, and the roleplay of building crowded out the actual gathering/building
  # (a 7-day run yielded 248 dialogue lines and one unfinished tent). 2 keeps
  # dialogue real without letting the camp talk a shelter into existence.
  dialogue_scene_lines: 2
  fog:
    home_radius: 10       # tiles each agent can see from spawn (per-agent sector)
    reveal_roles:         # structure roles always visible at spawn (survival infra)
      - escape
      - refill_oxygen
    vital_guarantee: 3    # N nearest water + food nodes always known (safety net)

agents:
  count: 5
  model_override: "stub"   # default world is free/instant; pick deepseek in Forge
  # blank = clean slate (Project Sid): identical agents, no authored identity/role.
  # Personality, roles, leaders and norms EMERGE from interaction — the actual test.
  # Other modes: library (abstract dispositions) | custom | self_select | mixed.
  persona_mode: blank
  # model: "stub" = free heuristic brain (no API). Any other value = an OpenRouter
  # model id (needs OPENROUTER_API_KEY). --model <id> overrides all for a quick run.
  # Names are auto: each agent picks its own (5 ranked preferences, no collisions).
  # Set a name here only if you want to force one. roster = per-agent model.
  roster:
    - { model: "stub" }
    - { model: "stub" }
    - { model: "stub" }
    - { model: "stub" }
    - { model: "stub" }

budget:
  usd_cap: 0              # Phase 2 (OpenRouter). 0 = ignored with stub LLM.
  model_context_window: 1048576       # deepseek/deepseek-v4-flash context window
  context_tokens_per_agent_tick: 32000 # local prompt budget, not model max context
  max_output_tokens: 1024             # JSON action output cap
  summarize_at_tokens: 12000

# ── LLM behaviour ─────────────────────────────────────────────────────────────
llm:
  # What happens when a real model call fails (no key / api error / budget /
  # unparseable). "stub" = heuristic stands in (sim never stalls, but heuristic
  # behaviour enters the data). "wait" = agent does nothing that turn, so a
  # research run's data stays clean. Use "wait" when the run is data.
  fallback_policy: stub
  temperature: 0.85       # per-call sampling temperature (research: lower for stability)
  seed_requests: true     # forward `seed` to the provider for best-effort reproducibility
  reflect_with_llm: true  # periodic reflection is a real LLM synthesis, not a template
  dreams: true            # night rest consolidates the day into a short dream
  # Split thinking (PIANO): "full" = full world prompt every tick (original);
  # "split" = one deliberation per `deliberate_every` ticks sets a day plan and
  # per-tick decisions use a compact prompt — severalfold cheaper real-model
  # runs with more coherent multi-day behaviour.
  thinking: full
  deliberate_every: 12

# ── Narrator (saga voice-over) ────────────────────────────────────────────────
# A separate LLM voice that retells the event stream as literary saga fragments,
# shown in the observer's chronicle panel. Needs a real model + API key: with
# model "" it borrows the first real agent's model, so stub-only worlds have no
# narrator (free worlds stay free).
narrator:
  enabled: true
  model: ""               # explicit model id, or "" = first real agent's model
  every_ticks: 12         # one saga fragment per N ticks (12 = once per sim-day)

# ── Research instrumentation ──────────────────────────────────────────────────
research:
  record: true            # write logs/runs/<id>/ (events, metrics, llm, meta)
  log_llm: true           # capture full prompt+response per call (large; off for long runs)
  taint_threshold: 0.20   # flag a run tainted if >this share of decisions were heuristic
  # Theory-of-mind probes: every N ticks ask each real-LLM agent how the others
  # relate to IT and score against ground truth. 0 = off. Stub agents skipped.
  tom_probe_every: 12
