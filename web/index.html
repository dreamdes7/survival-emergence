<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survival Emergence Observer</title>
  </head>
  <body>
    <div id="app">
      <!-- Full-screen world canvas -->
      <div id="stage"></div>
      <div id="overlay" class="overlay"></div>

      <!-- Cinematic optics: letterbox bars + an optical viewfinder that frames
           the followed survivor (focus brackets, vignette, REC). Toggled live. -->
      <div id="cinebox" class="cinebox">
        <div class="cine-bar cine-top"></div>
        <div class="cine-bar cine-bot"></div>
        <div class="vf-vig"></div>
        <div class="vf vf-tl"></div><div class="vf vf-tr"></div>
        <div class="vf vf-bl"></div><div class="vf vf-br"></div>
        <div class="vf-rec"><span class="vf-dot"></span>REC</div>
      </div>

      <!-- Top-center: world status readout -->
      <div class="world-stats floaty" id="world-stats"></div>

      <!-- Bottom-center: map tools -->
      <div class="viewport-tools floaty" id="viewport-tools">
        <button type="button" data-zoom="out" title="Zoom out">−</button>
        <button type="button" data-zoom="in" title="Zoom in">+</button>
        <button type="button" data-zoom="reset" title="Reset view">⤢</button>
        <span class="vt-sep"></span>
        <button type="button" id="pause-btn" data-control="pause" title="Pause / resume">⏸</button>
        <button type="button" id="replay-btn" title="Replay — отмотать историю">⏪</button>
        <button type="button" id="style-btn" title="Стиль рендера: вектор ↔ тайлы">🎨</button>
        <button type="button" id="audio-btn" title="Звук: эмбиент вкл/выкл">🔇</button>
        <button type="button" id="gfx-btn" title="Стиль и графика">⚙</button>
      </div>

      <!-- Graphics / style panel (presets + live sliders) -->
      <div id="gfx-panel" class="gfx-panel floaty" hidden>
        <div class="gfx-head">
          <span class="dock-label">Стиль и графика</span>
          <button type="button" id="gfx-close" class="gfx-close" aria-label="Close">✕</button>
        </div>
        <div class="gfx-presets" id="gfx-presets"></div>
        <div class="gfx-controls" id="gfx-controls"></div>
      </div>

      <!-- Replay scrubber (hidden until replay mode) -->
      <div id="replay-bar" class="replay-bar floaty" hidden>
        <span class="replay-tag">⏪ replay</span>
        <input type="range" id="replay-slider" min="0" max="0" value="0">
        <span id="replay-label" class="replay-label"></span>
        <button type="button" id="replay-close" title="Вернуться в прямой эфир">✕</button>
      </div>

      <!-- LEFT dock — identity · simulations · activity (one cohesive panel) -->
      <aside class="leftdock floaty">
        <div class="dock-head">
          <p class="eyebrow">Survival Emergence</p>
          <h1 id="world-title">Observer</h1>
          <div class="simbar" id="simbar"></div>
        </div>
        <div class="dock-label">Хроника</div>
        <div id="chronicle" class="chronicle"></div>
        <div class="dock-label">Activity</div>
        <div id="event-log" class="event-log"></div>
      </aside>

      <!-- RIGHT dock — forge + metrics (one panel, two sections) -->
      <aside class="rightdock floaty">
        <div class="dock-pad">
          <div class="dock-label">World Forge</div>
          <form id="forge-form" class="forge-form"></form>
        </div>
        <div class="dock-rule"></div>
        <div class="dock-pad">
          <div class="dock-label">Metrics</div>
          <div id="metrics-dashboard" class="metrics-dashboard"></div>
        </div>
      </aside>

      <!-- Bottom-right: world tally -->
      <div class="legend floaty" id="legend"></div>

      <!-- Bottom-center: live inspector for the selected/followed survivor -->
      <div id="inspector" class="inspector floaty" hidden>
        <button class="insp-close" id="insp-close" aria-label="Снять выбор">✕</button>
        <div class="insp-head">
          <span class="insp-swatch" id="insp-swatch"></span>
          <span class="insp-intent" id="insp-intent"></span>
          <span class="insp-name" id="insp-name"></span>
          <span class="insp-chips" id="insp-chips"></span>
        </div>
        <div class="insp-cog" id="insp-cog"></div>
        <div class="insp-bars" id="insp-bars"></div>
        <button class="insp-more" id="insp-more">детали →</button>
      </div>
    </div>

    <!-- Character / structure modal -->
    <div id="char-modal" class="cc-scrim" aria-modal="true" role="dialog" hidden>
      <div class="cc-card floaty">
        <button class="cc-close" id="cc-close" aria-label="Close">✕</button>
        <div id="cc-agent-view">
          <div class="cc-header">
            <div class="cc-swatch" id="cc-swatch"></div>
            <div>
              <div class="cc-name" id="cc-name"></div>
              <div class="cc-chips" id="cc-chips"></div>
            </div>
          </div>
          <div class="cc-cognition" id="cc-cognition"></div>
          <div class="cc-section-label">Vitals</div>
          <div class="cc-bars" id="cc-bars"></div>
          <div class="cc-section-label">Inventory</div>
          <div class="cc-inv" id="cc-inv"></div>
          <div class="cc-section-label">Ремёсла</div>
          <div class="cc-skills" id="cc-skills"></div>
          <div class="cc-section-label">Relationships</div>
          <div class="cc-rels" id="cc-rels"></div>
          <div class="cc-section-label">Мнения о людях</div>
          <div class="cc-beliefs" id="cc-beliefs"></div>
          <div class="cc-section-label">Diary</div>
          <div class="cc-diary" id="cc-diary"></div>
          <div class="cc-section-label">Интервью</div>
          <div class="cc-interview">
            <div id="cc-iv-log" class="cc-iv-log"></div>
            <form id="cc-iv-form" class="cc-iv-form">
              <input id="cc-iv-input" type="text" autocomplete="off"
                     placeholder="Спроси выжившего…">
              <button type="submit" title="Спросить">→</button>
            </form>
          </div>
        </div>
        <div id="cc-struct-view" hidden>
          <div id="cc-struct-body"></div>
        </div>
      </div>
    </div>

    <!-- New simulation modal -->
    <div id="newsim-modal" class="newsim-scrim" hidden>
      <div class="newsim-card floaty">
        <h2>New Simulation</h2>
        <form id="newsim-form" class="newsim-form">
          <div class="field">
            <label for="ns-scenario">Scenario</label>
            <select name="scenario" id="ns-scenario">
              <option value="island">island</option>
              <option value="mars">mars</option>
            </select>
          </div>
          <div class="ns-grid">
            <div class="field">
              <label for="ns-seed">Seed</label>
              <input type="number" name="seed" id="ns-seed" min="0" value="0">
            </div>
            <div class="field">
              <label for="ns-agents">Agents</label>
              <input type="number" name="agents" id="ns-agents" min="1" max="12" value="5">
            </div>
            <div class="field">
              <label for="ns-days">Days</label>
              <input type="number" name="days" id="ns-days" min="1" max="30" value="4">
            </div>
          </div>
          <div class="field">
            <label for="ns-model">Model <span class="hint">blank = stub</span></label>
            <input type="text" name="model" id="ns-model" list="model-options" placeholder="deepseek-ai/deepseek-v4-flash">
          </div>
          <div class="field">
            <label for="ns-provider">Provider</label>
            <select name="provider" id="ns-provider">
              <option value="openrouter">OpenRouter</option>
              <option value="megallm">MegaLLM</option>
              <option value="stub">Stub (free)</option>
            </select>
          </div>
          <div id="newsim-status" class="newsim-status" role="status" aria-live="polite"></div>
          <div class="newsim-actions">
            <button type="button" class="btn-cancel" id="newsim-cancel">Cancel</button>
            <button type="submit" class="btn-create">Launch ✦</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
